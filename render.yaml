services:
  # Backend FastAPI Web Service
  - type: web
    name: onyx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALCHEMY_API_KEY
        sync: false
      - key: OPENSEA_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_MOCK_FALLBACK
        value: "true"
